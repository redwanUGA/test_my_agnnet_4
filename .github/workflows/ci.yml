name: CI

on:
  push:
  pull_request:

jobs:
  cpu-smoke-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU PyTorch and PyG stack
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.3.1
          pip install pyg-lib torch-scatter torch-sparse torch-cluster torch-spline-conv -f https://data.pyg.org/whl/torch-2.3.0+cpu.html
          pip install torch-geometric==2.5.3
          pip install numpy==1.26.4 pandas==2.2.2 tqdm==4.66.4 scikit-learn==1.5.1 imbalanced-learn==0.12.3 ogb==1.3.6 gdown==5.2.0
      - name: Lint (ruff)
        run: |
          pip install ruff==0.5.7
          ruff --version
          ruff format --check . || true
          ruff check . || true
      - name: CPU smoke test
        run: |
          python backend/main.py --model BaselineGCN --dataset OGB-Arxiv --epochs 1 --cpu-smoke
  forward-pass-tests:
    runs-on: ubuntu-latest
    needs: cpu-smoke-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU PyTorch and PyG stack
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.3.1
          pip install pyg-lib torch-scatter torch-sparse torch-cluster torch-spline-conv -f https://data.pyg.org/whl/torch-2.3.0+cpu.html
          pip install torch-geometric==2.5.3
      - name: Run tiny forward passes
        run: |
          python - <<'PY'
          import torch
          from torch_geometric.data import Data
          import backend.models as models
          N, F, C = 20, 8, 4
          edge_index = torch.stack([torch.arange(0,N-1), torch.arange(1,N)])
          x = torch.randn(N, F)
          y = torch.randint(0, C, (N,))
          data = Data(x=x, edge_index=edge_index, y=y)
          for name, build in [
            ("BaselineGCN", lambda: models.BaselineGCN(F, 16, C)),
            ("GraphSAGE", lambda: models.GraphSAGE(F, 16, C)),
            ("GAT", lambda: models.GAT(F, 8, C, heads=2)),
          ]:
              m = build()
              out = m(data)
              assert out.shape == (N, C), f"{name} wrong shape: {out.shape}"
              print(f"{name} forward OK: {tuple(out.shape)}")
          PY