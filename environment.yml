name: gnn-artifacts
channels:
  - pytorch
  - pyg
  - conda-forge
dependencies:
  - python=3.10
  - pip=24.2
  - pytorch=2.3.1
  - cpuonly  # remove this and choose pytorch-cuda=11.8 or 12.1 on CUDA machines
  - pip:
      - numpy==1.26.4
      - pandas==2.2.2
      - tqdm==4.66.4
      - scikit-learn==1.5.1
      - imbalanced-learn==0.12.3
      - ogb==1.3.6
      - gdown==5.2.0
      - torch-geometric==2.5.3
      # Optional GPU-accelerated PyG ops (install matching wheels separately if using CUDA):
      # - torch-scatter==2.1.2
      # - torch-sparse==0.6.18
      # - torch-cluster==1.6.3
      # - torch-spline-conv==1.2.2
